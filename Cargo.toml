[package]
name = "vela-json"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Rust port of Vela stage2 tier-3 JSON parser (yyjson-style flat pool DOM fed by a simdjson-style structural index)"
license = "Apache-2.0"
publish = false

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"
simd-json = "0.18"
sonic-rs = "0.5"

[features]
default = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "scan"
harness = false
