[package]
name = "dacodec"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Fast, allocation-light JSON for Rust: a drop-in serde_json replacement plus a zero-copy wire format"
repository = "https://github.com/dacode-tech/dacodec"
license = "Apache-2.0"
keywords = ["json", "serde", "parser", "zero-copy", "simd"]
categories = ["encoding", "parser-implementations"]
readme = "README.md"

[dependencies]
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
simd-json = { version = "0.18", optional = true }
sonic-rs = { version = "0.5", optional = true }
# Shortest round-trip float formatting (Schubfach). serde_json 1.0.151 uses
# the same crate, so output is byte-identical and the benchmark compares
# serializers rather than float printers.
zmij = { version = "1", optional = true }

[[bin]]
name = "profile"
path = "src/bin/profile.rs"
required-features = ["profiling"]

[[bin]]
name = "fuzz"
path = "src/bin/fuzz.rs"
required-features = ["profiling"]

[[bin]]
name = "memprofile"
path = "src/bin/memprofile.rs"
required-features = ["profiling"]

[build-dependencies]
cc = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
simd-json = "0.18"
sonic-rs = "0.5"
# The reference zero-copy serialization framework for Rust, for the
# jsonflat comparison.
rkyv = "0.8"

[features]
# `serde` is on by default: it is what the public API is built from.
default = ["serde"]
# `serde::Deserializer` over the node pool - see src/de.rs.
serde = ["dep:serde", "dep:zmij"]
# Pulls in the comparison parsers so `src/bin/profile.rs` can build.
profiling = ["serde", "dep:serde_json", "dep:simd-json", "dep:sonic-rs"]
# Compiles the vendored yyjson (C) and simdjson (C++) baselines. Off by
# default: simdjson's amalgamation is 2.7 MB of C++17 and takes ~30s.
cbench = []
# Differential fuzzing harness (src/fuzz.rs). Needs serde_json to compare
# against, so it rides on the `profiling` feature's dependency set.
fuzzing = ["profiling"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Line tables only: no effect on codegen, but a sampling profiler can
# resolve symbols. See docs/PROFILING.md.
debug = 1
# `panic = "abort"` is deliberately NOT set: the benches and the profiling
# binary link dev-dependencies that unwind.

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "scan"
harness = false

[[bench]]
name = "structs"
harness = false

[[bench]]
name = "zerocopy"
harness = false

[[bench]]
name = "stage2"
harness = false

[[bench]]
name = "tiers"
harness = false

[[bench]]
name = "cbaseline"
harness = false
required-features = ["cbench"]
